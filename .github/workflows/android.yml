name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar el APK
        run: cp app/build/outputs/apk/release/app-release.apk EditorDePDF.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorDePDF-apk
          path: EditorDePDF.apk

      - name: Publicar versión descargable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Editor de PDF 1.0.${{ github.run_number }}
          files: EditorDePDF.apk
          body: |
            ${{ github.event.head_commit.message }}

            ---
            Descarga **EditorDePDF.apk** desde la tablet e instálalo.
            Si Android lo pide, permite «Instalar apps desconocidas» para el navegador o «Mis archivos».
